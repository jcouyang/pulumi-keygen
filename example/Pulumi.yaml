name: example
description: A minimal Pulumi YAML program
runtime: yaml
config: { "pulumi:tags": { value: { "pulumi:template": yaml } } }
plugins:
  providers:
    - name: keygen
      path: .

variables:
  age-encrypted:
    fn::invoke:
      function: keygen:age:encrypt
      arguments:
        recipients:
          - ${age-key.recipient}
        plaintext: hello
      return: result
  age-decrypted:
    fn::invoke:
      function: keygen:age:decrypt
      arguments:
        ciphertext: ${age-encrypted}
        identity: ${age-key.key}
      return: result
  hsm-encrypted:
    fn::invoke:
      function: keygen:pkcs11:encrypt
      arguments:
        tokenLabel: test
        keyLabel: ${hsm-key.keyLabel}
        plaintext: SGVsbG8sIEhTTSBXb3JsZCE=
      return: result
  hsm-decrypted:
    fn::invoke:
      function: keygen:pkcs11:decrypt
      arguments:
        tokenLabel: test
        keyLabel: ${hsm-key.keyLabel}
        ciphertext: ${hsm-encrypted}
      return: result
resources:
  aws-random:
    type: keygen:awskms:Random
    properties:
      numberOfBytes: 32
  aws-kms-data-key-pair:
    type: keygen:awskms:DataKeyPair
    properties:
      keyId: alias/keygen-test
      keyPairSpec: ECC_NIST_P256
  aws-kms-data-key:
    type: keygen:awskms:DataKey
    properties:
      keyId: alias/keygen-test
      keySpec: AES_256
  age-key:
    type: keygen:age:Identity
  age-key-from-aws-rand:
    type: keygen:age:Identity
    properties:
      random: ${aws-random.plaintext}
  age-key-from-aws-aes:
    type: keygen:age:Identity
    properties:
      random: ${aws-kms-data-key.plaintext}
  tls-ca:
    type: tls:SelfSignedCert
    properties:
      isCaCertificate: true
      privateKeyPem: ${aws-kms-data-key-pair.privateKey}
      validityPeriodHours: 0
      allowedUses:
        - cert_signing
  tls-cert-request:
    type: tls:CertRequest
    properties:
      privateKeyPem: ${aws-kms-data-key-pair.privateKey}
      subject:
        commonName: example.com
        organization: ACME Examples, Inc
  tls-cert:
    type: tls:LocallySignedCert
    properties:
      caCertPem: ${tls-ca.certPem}
      allowedUses:
        - digital_signature
        - key_encipherment
      validityPeriodHours: 0
      caPrivateKeyPem: ${tls-ca.privateKeyPem}
      certRequestPem: ${tls-cert-request.certRequestPem}
  hsm-key:
    type: keygen:pkcs11:Key
    properties:
      keyLabel: test-hsm-key-3
      tokenLabel: test
      keyType: RSA
      keySize: 2048
      validityPeriodHours: 8760

outputs:
  age-id: ${age-key.id}
  age-key-from-aws-rand-id: ${age-key-from-aws-rand.id}
  age-key-from-aws-aes-id: ${age-key-from-aws-aes.id}
  age-decrypted: ${age-decrypted}
  cert-from-kms-keypair: ${tls-cert.certPem}
  hsm-key-public-key: ${hsm-key.publicKey}
  hsm-decrypted: ${hsm-decrypted}
