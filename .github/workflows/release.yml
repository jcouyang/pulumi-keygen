name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  binary:
    strategy:
      matrix:
        os:
          - runner: "macos-latest"
            arch: "amd64"
            os: "darwin"
          - runner: "ubuntu-latest"
            arch: "amd64"
            os: "linux"
    runs-on: ${{ matrix.os.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - uses: cachix/install-nix-action@v31
      - run: |
          nix-shell --run 'make release-${{ matrix.os.os }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os.runner }}-binary
          path: ./dist
  release:
    needs:
      - binary
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v3
      - uses: cachix/install-nix-action@v31
      - uses: actions/download-artifact@v4
      - run: |
          nix-shell --run 'make release'
